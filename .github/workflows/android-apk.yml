name: Export verified Android APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download verified build 1005
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: budgetworker-saathi-apk-1005
          run-id: 39044898662
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Verify APK checksum and stage private download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: apk-build-1005-download
        run: |
          set -euo pipefail
          cd apk
          sha256sum --check SHA256SUMS.txt
          test -f budgetworker-saathi-build-1005-arm64.apk
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target f5da9c7bfd05dfce10a7366a181cd90f6488bb58 \
            --draft \
            --title 'BudgetWorker Android build 1005' \
            --notes 'Verified ARM64 test-signed APK built from merged main. Private draft used to deliver the standalone APK file.'
          gh release upload "$RELEASE_TAG" \
            budgetworker-saathi-build-1005-arm64.apk SHA256SUMS.txt build-info.txt signature.txt apk-info.txt \
            --repo "$GITHUB_REPOSITORY"
